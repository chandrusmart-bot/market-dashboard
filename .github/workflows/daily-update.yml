name: Daily market update

on:
  schedule:
    - cron: "30 13 * * 1-5"   # 19:00 IST
    - cron: "30 14 * * 1-5"   # 20:00 IST fallback (FII/DII can publish late); fresh tiles are skipped
  workflow_dispatch:

concurrency:
  group: daily-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Fetch data
        env:
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          ALPHAVANTAGE_API_KEY: ${{ secrets.ALPHAVANTAGE_API_KEY }}
        run: python scripts/fetch_data.py
      - name: Commit data if changed
        run: |
          git config user.name "market-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update market data $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
